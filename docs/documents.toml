# docs/documents.toml — the documents register (BBX-20; ruled R62, 2026-09-14): one bare table per
# tracked markdown page, every field named. Checked by `bbx documents --check` (lib/py/bbx/documents.py):
# complete both ways against `git ls-files '*.md'`; `shape` one of the fifteen of D82; a page whose
# leading lines carry `Shape:` names the row's shape as that line's first word; a `living` or `history`
# row names its twin (which names it back) or `none — <reason>`, and any other row's twin is empty;
# `routed_by` is `root` for the one map everything starts from, and otherwise a `map` or `census` page
# that names this page by its path. Hand-written; a new page gets its row in the commit that adds it.

[d1]
file = "CLAUDE.md"
shape = "constitution"
twin = ""
routed_by = "HANDOFF.md"

[d2]
file = "DECISIONS.md"
shape = "living"
twin = "DECISIONS_HISTORY.md"
routed_by = "HANDOFF.md"

[d3]
file = "DECISIONS_HISTORY.md"
shape = "history"
twin = "DECISIONS.md"
routed_by = "HANDOFF.md"

