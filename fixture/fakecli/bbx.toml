# bbx.toml — the COMMAND-LINE FIXTURE's consumer config: BBX's third consumer (docs/plans/S4.md §4;
# the first is bbh's example/ through the frame-driven kind, the second fixture/docset/). Every key left
# out takes the `command-line` kind profile's value (lib/py/bbx/config.py, D45), then the kind-blind
# default. Paths are relative to this file's directory. The fixture is GENERATED by mkfakecli.py (--check).

[project]
root = "."
kind = "command-line"

[suite]
replays_dir = "scenarios"       # the scenarios: <name>.cli (R32, R35: the extension is the profile's)
expected_dir = "expected"
registry = "expected/registry.tsv"
default_set = "fakecli"         # the tool: subject/fakecli.py; the whole-set key covers subject/*
driver = "cli"                  # $BBX_HOME/drivers/cli.sh (D28; S4 step 2)
