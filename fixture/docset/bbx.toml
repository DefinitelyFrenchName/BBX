# bbx.toml — the DOCUMENT-SET FIXTURE's consumer config: BBX's second consumer (docs/plans/S3.md
# §4; the first is bbh's example/ through the frame-driven kind). Every key left out takes the
# `document-set` kind profile's value (lib/py/bbx/config.py, D33), then the kind-blind default.
# Paths are relative to this file's directory. The fixture is GENERATED by mkdocset.py (--check).

[project]
root = "."
kind = "document-set"

[suite]
replays_dir = "claims"          # the scenarios: <name>.claims (R32: the extension is the profile's)
expected_dir = "expected"
registry = "expected/registry.tsv"
default_set = "records"         # the artifact: subject/records.tsv; the whole-set key covers subject/*
driver = "docset"               # $BBX_HOME/drivers/docset.sh (D28; S3 step 2)
