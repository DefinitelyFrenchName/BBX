# skills.toml — BBX's OWN skill, `bbx` (S5 step 4; rulings R51, R52, R54, R57). skill/bbx/SKILL.md and docs/rules.md
# are GENERATED from CLAUDE.md §4 and docs/gotchas.md by `bbx skill-gen --config skill/skills.toml`, the skill is locked
# to the page by `bbx check-skills --config skill/skills.toml`, and skill/bbx/GUIDE.md is written by `bbx skill-guide
# --config skill/skills.toml`; gates/skills.sh checks all three current. The root is the repository: this file lives
# one level down. Every value is a consumer value, registered in docs/defaults.md D69.
[project]
root = ".."

[skills]
prefixes = ["BBX"]
guided = ["BBX"]
history_exempt = ["STATE_HISTORY.md", "DECISIONS_HISTORY.md"]
guide_origin = "BBX, the generalization of the frame-driven blackbox-harness to any subject whose result must be demonstrably good to someone who cannot read how it was produced"
guide_header = [
  "# {title} — the guide", "",
  "The human rendition of `SKILL.md` in this directory: the same rules, the same IDs, each followed by the paragraph",
  "that anchors it in `docs/rules.md` — which incidents in the project re-anchored the rule, or that it is still",
  "inherited. **GENERATED** by `bbx skill-guide` and never hand-edited; regenerate in the harness. Origin: {origin}.",
  "The evidence names the project and its lineage; the RULES name neither. IDs are stable and never reused.", "",
  "**To use this skill elsewhere:** symlink this directory (`SKILL.md` + `GUIDE.md`) as `~/.claude/skills/{name}/`.",
  "Nothing in it depends on the harness tree at load time.", "",
]

[skill_BBX]
path = "skill/bbx/SKILL.md"
docs = ["docs/rules.md"]
logs = ["docs/bins/vampiresaved.md", "DECISIONS.md"]
numbers = "integers"
forbid = ["vsav", "vampire", "donovan", "huitzil", "phobos", "pyron", "tenant", "roster", "demitri", "jedah", "victor", "bishamon", "anita", "oboro", "build/", "merged", "m3b_", "cps", "qsound", "jtcps", "vsavjw", "wide_en", "14z-", "mister", "[RH-", "[VSP-", "[VSE-", "[CPE-", "[CPH-", "[MFI-", "[MJC-", "[MSC-", "[MSV-", "vampiresaved", "sailor moon", "fbneo", "[SMS-", "[SSP-", "[SNES-"]
name = "bbx"
description = "The evidence discipline of a black-box harness for any subject whose result must be demonstrably good to someone who cannot read how it was produced - code, a document set, a command-line tool, a build, a dataset - as generalized into BBX. Hard rules for verdicts, must-fire controls, registries and rot, comparison, documents as subjects, provenance and memory, and working discipline. Load before writing, running, freezing or reviewing any gate, control, expectation, comparator, registry or readout in a project that uses BBX, and before changing BBX itself. Project-agnostic."
title = "The evidence harness discipline (level 0, project-agnostic)"
intro = [
  "Agent-facing rules, IDs `[BBX-N]`. **This directory is SELF-CONTAINED and portable: `SKILL.md` is the rules,",
  "`GUIDE.md` beside it is the human rendition, the same rules each with the evidence for it, and the pair is what a",
  "session loads from `~/.claude/skills/`.** The rules are GENERATED from the rules section of the project constitution,",
  "never hand-written; each is anchored once in a generated rules page that says whether an incident in the project",
  "has re-anchored it or it is still inherited, and a skills lock checks the anchoring, the liftability, the numbers and",
  "the cross-references. The theme: **a green that cannot say what it does not assert is not finished.** Every rule",
  "below names a way evidence gets trusted past what it measured, and the mechanism that makes that loud. The skill",
  "cites one other skill, by `[BBH-N]` id only, and is meant to be loaded on any project.",
]
constitution = "CLAUDE.md"
section = "## 4."
ledger = "docs/gotchas.md"
page = "docs/rules.md"
cite = "BBH"
page_header = [
  "# Rules — the anchor page of the `bbx` skill",
  "",
  "Shape: living page, GENERATED by `bbx skill-gen --config skill/skills.toml` from the rules section of `CLAUDE.md`",
  "and the incident ledger `docs/gotchas.md`, never hand-edited: `bbx skill-gen --check`, run by `gates/skills.sh`,",
  "fails when this page is stale. One paragraph per rule, each anchored once. A rule is RE-ANCHORED when at least one",
  "ledger entry's explicit re-anchor list names it, and INHERITED otherwise, a candidate for dropping (R53). The",
  "paragraph is what `skill/bbx/GUIDE.md` quotes under the rule. Reachable from `HANDOFF.md`.",
]
