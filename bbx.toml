# bbx.toml — BBX's OWN consumer config: the harness reads its own tree as a
# subject (ruled R14). Every key left out takes the `self` kind profile's
# value, then the kind-blind default (lib/py/bbx/config.py; docs/defaults.md).
# Paths are relative to this file's directory.

[project]
root = "."
kind = "self"
gates_dir = "gates"
gate_glob = "*.sh"
runner_prefixes = ["run_"]
manual_suffixes = ["_soak"]
instrument_word = "instrument"

[registries]
portable = "gates/portable.txt"
static = "gates/static.txt"
# the static tier needs the lineage trees: bbh at $BBX_BBH_HOME (fidelity),
# and the census files' recorded roots (the recount SKIPs on its own)
static_needs_env = "BBX_BBH_HOME"

[tier]
# ONE gate of this tree reaches an instrument: gates/file_census.sh, which
# builds a shadow of HEAD and runs BBX's WHOLE battery inside it (R39, S4
# step 6). That is the instrument — heavy, and the reason the gate lives in
# gates/sweep.tsv at the release scope instead of in a tier that runs every
# battery. The pattern names the self-subject invocation only: the portable
# gates/file_census_tool.sh proves the same instrument on a synthetic tree
# through --root and stays PLAIN, so the portable tier keeps its promise.
# Why a pattern at all: a gate registered ONLY in the sweep registry is an
# ORPHAN under BBX-9 unless the tier classifies it INSTRUMENT — tier.py
# reads `known = portable | static` and exempts nothing else (X36, measured
# 2026-09-12). The fidelity gates are NOT instrument gates: they run bbh's
# tools, which are the SUBJECT of the frame-driven kind.
patterns = ['file-census --self']
source_regex = '^\s*\.\s+"?\$(?:BBX_HOME|\{BBX_HOME\})"?/(lib/sh/[a-z0-9_]+\.sh)'
source_depth = 2

[classify]
skip_regex = '^ *SKIP'
shell_error_regex = '\.sh: line [0-9]+: [A-Za-z_][A-Za-z0-9_]*: '
timeout_exits = [124, 137]
fail_tail = 12

[controls]
enforce = true

[gate_header]
# the gate index, docs/gates.md (bbx gate-index; S6 step 3, R63, R68): generated from each gate's own
# header, the family register gates/families.toml and the registries; gates/gate_index.sh fails when it
# is stale. BBX's session token is bbx-N; the two further columns are R68's.
index_out = "docs/gates.md"
families_tsv = "gates/families.toml"
session_regex = '\b(bbx-\d+|20\d\d-\d\d-\d\d)'
columns = ["controls", "blind spots"]
families = [["runner", "the runners, the classifier, the tiers, the controls contract and the readout: the kernel's own ground truth"],
            ["comparison", "the comparator families, their dispatch, the expectation kinds and the provenance register"],
            ["kinds", "the subject kinds end to end: fixtures, drivers, suites and the two adapters"],
            ["fidelity", "the lineage pairs: BBX's lifted tools against bbh's over the same inputs"],
            ["census", "the censuses: the lineage's counts and BBX's own file census"],
            ["registers", "the registers and the pages: rulings, close sweeps, skills, defaults, documents, rot, the gate index, the trap lint and the references in the current pages"]]
index_preamble = ["# Gates — the index (GENERATED)",
                  "",
                  "Shape: generated, written by `bbx gate-index --config bbx.toml` from each gate's own header, the family",
                  "register `gates/families.toml` and the registries, never hand-edited: `bbx gate-index --check`, run by",
                  "`gates/gate_index.sh`, fails when this page is stale. One row per gate under `gates/`, grouped by family:",
                  "`locks` is the first paragraph of the gate's header, cut near 240 characters; `needs` is nothing for a",
                  "portable gate, the static tier's variable for a static one, and for an instrument gate the runtime its",
                  "header quotes; `since` is the first session its header names; `controls` its declared must-fire controls",
                  "by shape; `blind spots` the count of its `NOT-ASSERTED:` lines. Reachable from `HANDOFF.md`."]
