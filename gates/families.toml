# gates/families.toml — the family of every gate under gates/, the one hand-maintained input of
# `bbx gate-index` (ruled R68, S6 step 3): one bare table per gate with `gate` and `family`, and optional
# `needs` and `since` overrides. docs/gates.md is GENERATED from this, the registries and each gate's
# own header. Completeness is checked both ways by `bbx gate-index --check` (gates/gate_index.sh): a gate
# with no table, a table whose gate is gone, and a gate named by two tables each fail. The families and
# their order are [gate_header].families in bbx.toml. A new gate gets its table in the commit that adds it.

